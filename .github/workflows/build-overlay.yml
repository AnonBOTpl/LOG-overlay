name: build-overlay

# Builds Overlay.exe on CI (SignPath Foundation requires CI-built artifacts).
# The exe is packaged as a zip and uploaded as a build artifact. Releases are
# assembled from these artifacts (optionally after SignPath code signing).

on:
  push:
    branches: [main]
    paths:
      - "overlay/**"
      - "shared/**"
      - "tools/build_overlay.py"
      - "requirements-overlay.txt"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-overlay.txt
          python -m pip install nuitka==4.1.3

      - name: Build Overlay.exe
        run: python tools/build_overlay.py

      - name: Derive version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $ver = $env:GITHUB_REF.Substring(10)
          } else {
            $ver = $env:GITHUB_SHA.Substring(0, 7)
          }
          Write-Output "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Package artifact
        shell: pwsh
        run: |
          $dest = "dist/LogOverlay-Overlay-$($env:CI_VERSION).zip"
          Compress-Archive -Path dist/Overlay -DestinationPath $dest
          Get-Item $dest | Select-Object Name, Length
        env:
          CI_VERSION: ${{ steps.version.outputs.version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogOverlay-Overlay-${{ steps.version.outputs.version }}
          path: dist/LogOverlay-Overlay-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error